<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="shortcut icon" href="img/badge.png">
    <link rel="icon" href="img/badge.png">
    <link rel="manifest" href="manifest.json">
    <title>Portable Objection</title>
    <meta name="keywords" content="Portable Objection" />
    <meta name="description" content="Objection anytime, anywhere!" />
    <link href="static/APlayer.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <center id="main">
        <div id="title-div">
            <p id="title1"><img src="img/badge.png" width="15px">&nbsp;&nbsp;Portable Objection!&nbsp;&nbsp;</p>
        </div>
        <div id="obje-div" class="content">
            <img id="img1" class="hide" src="img/igiari.png" alt="" srcset="" draggable="false" oncontextmenu="return false;">
        </div>
        <div id="panel1">
            <p><span id="sens">&nbsp;<br>Click the test below to start</span>&nbsp;<button id="btn2">Reset</button></p>
            <select id="character" name="character">
                <optgroup label="Defense Attorneys">
                    <option value="cbt" selected>Phoenix Wright</option>
                    <option value="qian">Mia Fey</option>
                    <option value="wang">Apollo Justice</option>
                    <option value="xin">Athena Cykes</option>
                    <option value="dhurke">Dhurke Sahdmadhi</option>
                </optgroup>
                <optgroup label="Prosecutors">
                    <option value="yuj">Miles Edgeworth</option>
                    <option value="hao">Manfred von Karma</option>
                    <option value="ming">Franziska von Karma</option>
                    <option value="godo">Godot</option>
                    <option value="yanei">Winston Payne</option>
                    <option value="xiang">Klavier Gavin</option>
                    <option value="xun">Simon Blackquill</option>
                    <option value="nayuta">Nahyuta Sahdmadhi</option>
                    <option value="garan">Ga'ran Sigatar Khura'in</option>
                    <option value="none" disabled>To be added...</option>
                </optgroup>
            </select>
            <select id="voicetype" name="voicetype">
                <optgroup label="Japanese">
                    <option value="igiari" selected>Objection!</option>
                    <option value="matta">Hold it!</option>
                    <option value="kurae">Take that!</option>
                    <option value="damarinaa">Silence!</option>
                    <option value="satora-ja">Satorha!</option>
                    <option value="hirehuse">Bow down!</option>
                </optgroup>
                <optgroup label="English">
                    <option value="objection">Objection!</option>
                    <option value="holdit">Hold It!</option>
                    <option value="takethat">Take that!</option>
                    <option value="silence">Silence!</option>
                    <option value="satorha">Satorha!</option>
                    <option value="insolence">Such Insolence!</option>
                </optgroup>
                <optgroup label="Chinese">
                    <option value="yiyi">Objection!</option>
                    <option value="fandui">Oppose!</option>
                    <option value="dengdeng">Wait!</option>
                    <option value="kanzhao">Take this!</option>
                    <option value="kanzhege">Look at this!</option>
                    <option value="bizui">Shut up!</option>
                    <option value="satora-cn">Satora!</option>
                    <option value="guixia">Kneel down!</option>
                </optgroup>
            </select>
            <div>
                <label for="lmd">Threshold (Sensitivity)</label>&nbsp;&nbsp;<span id="lmdv">[5]&nbsp;&nbsp;Place flat on the table</span><br>
                <input type="range" id="lmd" name="lmd" list="tickmarks" min="0.2" max="80" value="5" step="0.2" />
                <datalist id="tickmarks">
                    <option value="0.2" label="0.2" style="margin-left: -3px;"></option>
                    <option value="20" label="20"></option>
                    <option value="40" label="40"></option>
                    <option value="60" label="60"></option>
                    <option value="80" label="80" style="margin-left: 3px;margin-right: -3px;"></option>
                    <!-- <option value="100" label="100"></option> -->
                </datalist>
            </div>
            <div style="font-weight: bold;">
                <span>Before use, click </span>
                <button id="btn1">Test</button>
                <span id="sensok">❎</span>
                <span>to ensure sound plays normally </span><span id="cacheok">💬</span>&nbsp;<button id="btn3">🗑️</button>
            </div>
            <div style="line-height: 20px; margin-top: 10px;">
                <input type="checkbox" id="automusic" name="automusic" value="automusic"
                    style="vertical-align:middle" />
                <label for="automusic" style="vertical-align:middle">Auto-play music<span> (player at bottom-left, expand to change)</span></label>
            </div>
        </div>
    </center>
    <meting-js server="netease" type="playlist" id="9487616885" fixed="true" loop="one" order="list" preload="false" list-folded="ture" list-max-height="350px" ></meting-js>
    <script src="static/device.min.js"></script>
    <script src="static/APlayer.min.js"></script>
    <script src="static/Meting.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
